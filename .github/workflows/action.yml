 update_manifest_file:
    runs-on: ubuntu-latest 
    env:
     IMAGE_TAG: ${{github.run_number}}
    needs: 
     - build_frontend_scan_push
     - build_backend_scan_push
    steps:

    - name: checkout code
      uses: actions/checkout@v4
    - name: clone manifest repo
      run: git clone https://github.com/Mahi-oops/Github_action_CICD_manifest.git
    - name: list files in manifest repo
      run: ls -l 
    - name: Checking path
      run: pwd
    - name: update the frontend-deployment file
      run: |
        cd Github_action_CICD_manifest && cd frontend
        pwd
        sed -i "s/booking-app:.*/booking-app:$IMAGE_TAG/g" frontend-deployment.yml
        cat frontend-deployment.yml
    - name: Update the backend-deployment file
      run: |
        cd Github_action_CICD_manifest && cd backend
        pwd
        sed -i "s/backend-app:.*/backend-app:$IMAGE_TAG/g" backend-deployment.yml
        cat backend-deployment.yml   
    - name: commit and push changes
      run: |
        cd Github_action_CICD_manifest
        git config --global user.name "Mahi-oops"
        git config --global user.email "avula2302@gmail.com"
        git add .
        git commit -m "Update the manifest file booking-app:$IMAGE_TAG"
        git push https://Mahi-oops:${{secrets.CICD_GIT_SECRETS}}@github.com/Mahi-oops/Github_action_CICD_manifest.git main
    - name: success message
      run: echo "Manifest file updated successfully!!"