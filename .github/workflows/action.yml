name: CI_CD_Pipeline


on:
 push:
  branches: ['main']

permissions:
 contents: write
 packages: write
 security-events: write

jobs:
 sast_scan:
  runs-on: ubuntu-latest
  steps:
  - name: code checkout
    uses: actions/checkout@v4
  - name: install dependencies
    uses: github/codeql-action/init@v3
    with:
      languages: javascript-typescript
  - name: Install the dependencies & build 
    run: | 
     cd booking && npm ci
     npm run build
  - name: Install the dependencies & build 
    run: | 
     cd backend && npm ci
  - name: run codeql analysis
    uses: github/codeql-action/analyze@v3

 dependency-scan:
  runs-on: ubuntu-latest
  needs: sast_scan
  steps:
   - name: code checkout
     uses: actions/checkout@v4
   - name: run frontend scan
     run: |
       cd booking
       npm ci
       npm audit --audit-level=high
   - name: run backend scan
     run: |
        cd backend
        npm ci
        npm audit --audit-level=high
   - name: success message
     run: echo "Dependency scan completed successfully!!!!!!!!!!!"


 build_frontend_scan_push:
  runs-on: ubuntu-latest
  needs: dependency-scan
  env:
   IMAGE_TAG: ${{github.run_number}}
  steps:
   - name: checkout code
     uses: actions/checkout@v4
   - name: Checking path
     run: pwd
   - name: Accessing the file
     run: cd booking && pwd
   - name: Build and push docker image
     run: docker build -t ghcr.io/mahi-oops/booking-app:$IMAGE_TAG ./booking
   - name: scan the docker image
     uses: aquasecurity/trivy-action@master
     with:
      image-ref: ghcr.io/mahi-oops/booking-app:${{env.IMAGE_TAG}}
      format: table
      exit-code: 1
      severity: HIGH,CRITICAL
   - name: login to github container registry
     uses: docker/login-action@v2
     with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}
   - name: Access folder
     run: cd booking 
   - name: push image to GHCR
     run: docker push ghcr.io/mahi-oops/booking-app:$IMAGE_TAG

 build_backend_scan_push:
  runs-on: ubuntu-latest
  needs: dependency-scan
  env:
   IMAGE_TAG: ${{github.run_number}}
  steps:
   - name: checkout code
     uses: actions/checkout@v4
   - name: Checking path
     run: pwd
   - name: Accessing the file
     run: cd backend && pwd
   - name: Build and push docker image
     run: docker build -t ghcr.io/mahi-oops/backend-app:$IMAGE_TAG ./backend
   - name: scan the docker image
     uses: aquasecurity/trivy-action@master
     with:
      image-ref: ghcr.io/mahi-oops/backend-app:${{env.IMAGE_TAG}}
      format: table
      exit-code: 1
      severity: HIGH,CRITICAL
   - name: login to github container registry
     uses: docker/login-action@v2
     with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}
   - name: Access folder
     run: cd backend 
   - name: push image to GHCR
     run: docker push ghcr.io/mahi-oops/backend-app:$IMAGE_TAG


